; Obsidia Prototype V1 main controller
; ESP32-S3 N16R8, ST7735, CardKB and shared-bus microSD

[env:OBSIDIA_V1]
board = ESP-General
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/OBSIDIA_V1>
build_flags =
	${env.build_flags}
	-Iboards/OBSIDIA_V1
	-DOBSIDIA_V1=1
	-DBOARD_HAS_PSRAM=1
	-DUSB_as_HID=1
	-DHAS_KEYBOARD=1
	-DHAS_KEYBOARD_HID=1

	; Confirmed 1.8 inch ST7735 128x160 display.
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=21
	-DMINBRIGHT=0
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_BLACKTAB=1
	-DTFT_INVERSION_ON=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=14
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=10000000
	-DSPI_READ_FREQUENCY=4000000
	-DSPI_TOUCH_FREQUENCY=2500000

	; Passive 3.3 V microSD breakout on the display SPI bus.
	-DSDCARD_CS=8
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11

	; M5Stack CardKB v1.1 and future shared I2C peripherals.
	-DGROVE_SDA=40
	-DGROVE_SCL=41
	-DSYS_I2C_SDA=40
	-DSYS_I2C_SCL=41

	; Confirmed IR transmitter assignment; receiver is not assigned yet.
	-DTXLED=17
	-DRXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"Obsidia IR TX", TXLED}}'
	-DIR_RX_PINS='{}'
	-DRF_TX_PINS='{}'
	-DRF_RX_PINS='{}'

	; Default exposed SPI bus follows the display/SD wiring. Radio devices
	; are owned by the second ESP32 and are not enabled locally.
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=8
	-DSERIAL_RX=-1
	-DSERIAL_TX=-1
	-DGPS_SERIAL_RX=-1
	-DGPS_SERIAL_TX=-1

	-DFP=1
	-DFM=2
	-DFG=3
	-DBTN_ALIAS='"Enter"'
	-DDEVICE_NAME='"OBSIDIA V1"'

lib_deps =
	${env.lib_deps}
