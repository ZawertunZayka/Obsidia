[platformio]
default_envs = shared-spi-diagnostic

[env:shared-spi-diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/builds/main_esp32-arduino-libs-20260715-140131.tar.gz
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
lib_deps = TFT_eSPI=symlink://../../lib/TFT_eSPI
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_BLACKTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DTOUCH_CS=-1
    -DSPI_FREQUENCY=10000000
    -DSPI_READ_FREQUENCY=4000000
    -DLOAD_GLCD=1
