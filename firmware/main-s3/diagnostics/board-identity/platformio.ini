[platformio]
default_envs = identity-n16r8

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Safe first probe: does not configure PSRAM. Use it only after esptool confirms
; that the connected USB device is an ESP32-S3.
[env:identity-safe]
board = esp32-s3-devkitc-1

; Runtime probe for the visually confirmed ESP32-S3-WROOM N16R8 module.
[env:identity-n16r8]
board = esp32-s3-devkitc1-n16r8
