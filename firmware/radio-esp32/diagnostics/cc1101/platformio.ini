[platformio]
default_envs = cc1101-diagnostic

[env:cc1101-diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
build_flags =
    -std=gnu++17
    -D OBSIDIA_CC1101_SCLK_GPIO=-1
    -D OBSIDIA_CC1101_MISO_GPIO=-1
    -D OBSIDIA_CC1101_MOSI_GPIO=-1
    -D OBSIDIA_CC1101_CS_GPIO=-1
    -D OBSIDIA_CC1101_SPI_HZ=1000000
build_unflags = -std=gnu++11
