[platformio]
default_envs = rdm6300-diagnostic

[env:rdm6300-diagnostic]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
build_flags =
    -std=gnu++17
    -D OBSIDIA_RDM6300_RX_GPIO=-1
build_unflags = -std=gnu++11
