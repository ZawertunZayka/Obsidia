[platformio]
default_envs = obsidia-radio

[env:obsidia-radio]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../common
build_flags =
    -std=gnu++17
    -D OBSIDIA_RADIO_RX_GPIO=16
    -D OBSIDIA_RADIO_TX_GPIO=17
    -D OBSIDIA_NRF24_SCLK_GPIO=18
    -D OBSIDIA_NRF24_MISO_GPIO=19
    -D OBSIDIA_NRF24_MOSI_GPIO=23
    -D OBSIDIA_NRF24_CSN_GPIO=21
    -D OBSIDIA_NRF24_CE_GPIO=22
    -D OBSIDIA_NRF24_SPI_HZ=1000000
build_unflags = -std=gnu++11
